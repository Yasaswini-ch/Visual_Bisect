[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-bisect"
version = "0.1.0"
description = "git bisect that can see: find the commit that changed what you see, from one old screenshot."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "google-genai", "playwright", "pillow", "scikit-image", "numpy", "rich",
  "fastapi", "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
vbisect = "vbisect.cli:main"

[tool.setuptools.packages.find]
include = ["vbisect*"]

[tool.setuptools.package-data]
vbisect = ["prompts/*.txt", "web_dist/*", "web_dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
