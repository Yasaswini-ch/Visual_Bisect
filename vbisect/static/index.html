<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Bisect</title>
<style>
:root{--bg:#f6f1e7;--panel:#fbf8f1;--line:#e2d9c8;--text:#2b2118;--dim:#7a6c5a;--acc:#b5543a;--tan:#d9ccb4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
header{max-width:1100px;margin:0 auto;padding:22px 24px 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:24px;margin:0}
header .tag{color:var(--dim);font-style:italic;font-family:Georgia,serif}
.sp{flex:1}
select,input,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
select{max-width:320px}
button.primary{background:var(--text);color:var(--bg);border-color:var(--text);cursor:pointer}
button.ghost{cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:8px 24px 64px}
.empty{color:var(--dim);padding:60px 0;text-align:center;font-family:Georgia,serif;font-size:20px}
.hero{padding:28px 0 20px;border-bottom:1px solid var(--line)}
.hero small{color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.hero h2{font-size:30px;line-height:1.2;margin:6px 0 8px}
.hero .meta{color:var(--dim)}
.hero .hash{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:var(--tan);padding:1px 8px;border-radius:6px;color:var(--text)}
.hero.found h2{color:var(--acc)}
h3{font-family:Georgia,serif;font-size:19px;margin:34px 0 12px;font-weight:600}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.refs figure{margin:0}.refs img{width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:#fff}
figcaption{font-size:13px;color:var(--dim);margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.cell{width:14px;height:34px;border-radius:3px;border:1.5px solid var(--tan);background:transparent}
.cell.old{background:var(--tan)}.cell.new{background:var(--acc);border-color:var(--acc)}
.cell.skip{border-style:dashed;border-color:var(--dim);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--tan) 3px 5px)}
.cell.cur{outline:2px solid var(--text);outline-offset:2px}
.cell.cul{outline:3px solid var(--acc);outline-offset:2px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:var(--dim);font-size:14px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--tan)}
.legend .o::before{background:var(--tan)}.legend .n::before{background:var(--acc);border-color:var(--acc)}
.legend .s::before{border-style:dashed;border-color:var(--dim)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step img{width:100%;display:block;border-bottom:1px solid var(--line);background:#fff}
.step .ph{height:150px;display:flex;align-items:center;justify-content:center;color:var(--dim);border-bottom:1px solid var(--line)}
.step .b{padding:12px 14px}
.pill{display:inline-block;padding:1px 12px;border-radius:99px;font-size:13px;border:1.5px solid var(--dim);color:var(--dim)}
.pill.new{background:var(--acc);border-color:var(--acc);color:#fff}
.pill.old{border-color:var(--tan);background:var(--tan);color:var(--text)}
.pill.skip{border-style:dashed}
.sub{margin:6px 0 2px;font-weight:600}.hash{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim)}
details{margin-top:8px;color:var(--dim);font-size:14px}summary{cursor:pointer}
details p{margin:6px 0}
pre{white-space:pre-wrap;max-height:280px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;margin:0}
dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(520px,92vw);padding:24px}
dialog::backdrop{background:rgba(43,33,24,.35)}
label{display:block;margin:12px 0 4px;color:var(--dim);font-size:13px}dialog input,dialog select{width:100%;max-width:none}
@media(max-width:720px){.refs{grid-template-columns:1fr}.hero h2{font-size:24px}header,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <h1>Visual Bisect</h1><span class="tag">git bisect that can see</span><span class="sp"></span>
  <select id="runSel" aria-label="Run"></select>
  <button class="primary" id="newBtn">New run</button>
</header>
<main id="view"><div class="empty">Choose a run above, or start a new one.</div></main>

<dialog id="dlg"><form id="form" method="dialog">
  <h2 style="margin:0 0 4px;font-size:24px">New run</h2>
  <label>Local git repo path</label><input name="repo" required placeholder="C:\path\to\repo">
  <label>Good (old) commit</label><input name="good" required>
  <label>Bad (new) commit</label><input name="bad" value="HEAD">
  <label>What changed, in words</label><input name="focus" required placeholder="the left sidebar (logo, icons, text size)">
  <label>Page path</label><input name="url" value="/">
  <label>Judge</label><select name="judge"><option>gemma</option><option>pixel-full</option></select>
  <label>Preset</label><select name="preset"><option value="">vite (default)</option><option>next</option><option>static</option></select>
  <p style="margin:20px 0 0;display:flex;gap:10px;align-items:center"><button class="primary" type="submit">Start</button><button type="button" class="ghost" id="cancel">Cancel</button><span id="err" style="color:var(--acc)"></span></p>
</form></dialog>

<script>
const $=s=>document.querySelector(s);let cur=null,es=null,state=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=(run,name)=>`/api/file?run=${encodeURIComponent(run)}&name=${encodeURIComponent(name)}`;
const fresh=()=>({start:null,steps:{},order:[],done:null,failed:null,current:null,calls:{}});

async function loadRuns(){
  try{
    const rows=await (await fetch('/api/runs')).json();
    $('#runSel').innerHTML='<option value="">Select a run…</option>'+rows.map(r=>`<option value="${esc(r.id)}" ${r.id===cur?'selected':''}>${esc(r.id)}  ·  ${esc(r.state)}</option>`).join('');
  }catch(e){}
}
function apply(e){
  const s=state;
  if(e.type==='run_started'){s.start=e;s.order=e.commits.map(c=>c.sha)}
  else if(e.type==='step_started'){s.current=e.sha;s.steps[e.sha]=s.steps[e.sha]||{}}
  else if(e.type==='render_done'){(s.steps[e.sha]=s.steps[e.sha]||{}).img=e.img}
  else if(e.type==='judge_call'){(s.calls[e.sha]=s.calls[e.sha]||[]).push(e)}
  else if(e.type==='step_done'){const x=s.steps[e.sha]=s.steps[e.sha]||{};x.verdict=e.verdict;x.skip=e.skip_reason;if(s.current===e.sha)s.current=null}
  else if(e.type==='run_done'){s.done=e;s.current=null}
  else if(e.type==='run_failed'){s.failed=e;s.current=null}
}
function render(){
  const s=state;
  if(!s||!s.start){$('#view').innerHTML='<div class="empty">Waiting for the run to start…</div>';return}
  const st=s.start,subj=Object.fromEntries(st.commits.map(c=>[c.sha,c.subject]));
  const tested=s.order.filter(sha=>s.steps[sha]?.verdict);
  const left=Math.max(0,st.commits.length-tested.length);
  let hero;
  if(s.failed) hero=`<div class="hero"><small>Run failed</small><h2>Something went wrong</h2><div class="meta">${esc(String(s.failed.error).slice(0,300))}</div></div>`;
  else if(s.done&&s.done.culprit_sha) hero=`<div class="hero found"><small>Culprit found</small><h2>${esc(subj[s.done.culprit_sha]||'')} <span class="hash">${esc(s.done.culprit_sha.slice(0,10))}</span></h2><div class="meta">${s.done.steps} steps · ${s.done.skips} skipped · ${s.done.api_calls} model calls · ${s.done.seconds}s</div></div>`;
  else if(s.done) hero=`<div class="hero"><small>Finished</small><h2>Could not narrow to one commit</h2><div class="meta">${s.done.skips} steps were skipped as unsure or failed.</div></div>`;
  else hero=`<div class="hero"><small>Searching</small><h2>${esc(st.focus)}</h2><div class="meta">${tested.length} of ${st.commits.length} commits tested${s.current?' · testing '+esc(s.current.slice(0,10))+'…':''}</div></div>`;
  let h=hero;
  h+=`<h3>The change we are looking for</h3><p class="meta" style="margin:0 0 12px;color:var(--dim)">${esc(st.focus)} · judge: ${esc(st.judge)}${st.model?' · '+esc(st.model):''}</p>
  <div class="refs"><figure><figcaption>Before (old)</figcaption><img src="${img(cur,st.old_ref_img)}"></figure><figure><figcaption>After (new)</figcaption><img src="${img(cur,st.new_ref_img)}"></figure></div>`;
  const cells=s.order.map(sha=>{const v=s.steps[sha]?.verdict;return `<div class="cell ${v||''} ${s.current===sha?'cur':''} ${s.done?.culprit_sha===sha?'cul':''}" title="${esc(sha.slice(0,10)+'  '+subj[sha])}"></div>`}).join('');
  h+=`<h3>Search progress</h3><div class="strip">${cells}</div><div class="legend"><span class="o">looks old</span><span class="n">looks new</span><span class="s">skipped</span><span>not tested</span></div>`;
  const rows=[...tested].reverse();
  if(s.current&&!tested.includes(s.current))rows.unshift(s.current);
  if(rows.length){
    h+='<h3>Steps</h3><div class="steps">'+rows.map(sha=>{
      const x=s.steps[sha]||{},c=(s.calls[sha]||[]).slice().sort((a,b)=>a.call_no-b.call_no);
      const why=c.length?`<details><summary>Why (${c.length} model call${c.length>1?'s':''})</summary>${c.map(k=>`<p>${esc(k.verdict)}, ${Math.round((k.confidence||0)*100)}% sure: ${esc(k.reason)}</p>`).join('')}</details>`:'';
      const note=x.skip?`<details open><summary>Skipped</summary><p>${esc(String(x.skip).slice(0,200))}</p></details>`:'';
      return `<div class="step">${x.img?`<img src="${img(cur,x.img)}" loading="lazy">`:'<div class="ph">building…</div>'}<div class="b">${x.verdict?`<span class="pill ${x.verdict}">${x.verdict==='old'?'looks old':x.verdict==='new'?'looks new':'skipped'}</span>`:'<span class="pill">testing…</span>'}<div class="sub">${esc(subj[sha])}</div><div class="hash">${esc(sha.slice(0,10))}</div>${note}${why}</div></div>`}).join('')+'</div>';
  }
  if(s.done?.diff_file)h+='<h3>What the culprit changed</h3><pre id="diff">Loading…</pre>';
  $('#view').innerHTML=h;
  if(s.done?.diff_file)fetch(`/api/diff?run=${encodeURIComponent(cur)}`).then(r=>r.json()).then(d=>{const p=$('#diff');if(p)p.textContent=d.diff}).catch(()=>{});
}
async function open(id){
  if(es){es.close();es=null}
  cur=id||null;
  if(!cur){state=null;$('#view').innerHTML='<div class="empty">Choose a run above, or start a new one.</div>';return}
  state=fresh();
  const evs=await (await fetch('/api/events?run='+encodeURIComponent(id))).json();
  evs.forEach(apply);render();loadRuns();
  if(!state.done&&!state.failed){
    let seen=0;const n=evs.length;
    es=new EventSource('/api/stream?run='+encodeURIComponent(id));
    es.onmessage=m=>{if(seen++<n)return;apply(JSON.parse(m.data));render()};
    es.onerror=()=>{if(es){es.close();es=null}loadRuns()};
  }
}
$('#runSel').onchange=e=>open(e.target.value);
$('#newBtn').onclick=()=>$('#dlg').showModal();
$('#cancel').onclick=()=>$('#dlg').close();
$('#form').onsubmit=async ev=>{
  ev.preventDefault();
  const body=Object.fromEntries(new FormData(ev.target));if(!body.preset)delete body.preset;
  const r=await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){$('#err').textContent=(await r.json()).detail||'failed';return}
  const {id}=await r.json();$('#dlg').close();setTimeout(async()=>{await loadRuns();$('#runSel').value=id;open(id)},1500);
};
loadRuns();setInterval(loadRuns,5000);
</script>
</body>
</html>
