<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Bisect</title>
<style>
:root{--bg:#fdfcfa;--ink:#15171c;--dim:#8a8f9a;--line:#e7e5df;--card:#f6f5ef;--bar:#14161d;--acc:#d63a3a;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Inter","DM Sans","Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bar{background:var(--bar);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .logo{font-weight:800;font-size:19px;letter-spacing:-.02em}
.bar .logo i{font-style:normal;color:var(--acc)}
.bar .sp{flex:1}
.bar select{background:#232733;color:#fff;border:1px solid #343949;max-width:min(380px,56vw)}
select,input{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button{font:inherit;font-weight:600;white-space:nowrap;border-radius:10px;padding:9px 18px;cursor:pointer;border:1px solid transparent}
button.primary{background:var(--acc);color:#fff}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.page{max-width:1040px;margin:0 auto;padding:44px 28px 90px}
h1{font-size:clamp(34px,5vw,52px);letter-spacing:-.03em;line-height:1.05;margin:0 0 10px;font-weight:800}
.sub{color:var(--dim);font-size:18px;margin:0 0 28px}
.rule{border:0;border-top:1px solid var(--line);margin:0 0 28px}
.label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.story{font-family:var(--serif);font-size:clamp(22px,3vw,30px);line-height:1.35;margin:0 0 34px;max-width:860px}
.story b{font-weight:600}
.story code{font-family:ui-monospace,Consolas,monospace;font-size:.62em;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px;vertical-align:.12em}
.callout{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin:0 0 38px}
.callout .label{margin-bottom:8px}
.callout .t{font-family:var(--serif);font-size:20px}
.callout .d{color:#5b606b;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:0 0 46px}
.stat .n{font-size:clamp(44px,7vw,76px);font-weight:800;letter-spacing:-.045em;line-height:1}
.stat .n u{text-decoration:none;color:var(--acc);font-size:.5em;margin-left:3px;letter-spacing:0}
.stat .label{margin:10px 0 0}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:46px}
.refs figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.refs figcaption{margin:0 0 10px}
.refs img{width:100%;display:block;border-radius:8px;border:1px solid var(--line);background:#fff}
.strip{display:flex;gap:3px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.cell{width:12px;height:36px;border-radius:4px;border:1.5px solid #cfcdc6;background:transparent}
.cell.old{background:#cfcdc6}.cell.new{background:var(--acc);border-color:var(--acc)}
.cell.skip{border-style:dashed;border-color:var(--dim)}
.cell.cur{outline:2px solid var(--ink);outline-offset:2px}
.cell.cul{outline:2px solid var(--acc);outline-offset:2px;background:#fff}
.key{display:flex;gap:20px;flex-wrap:wrap;color:var(--dim);font-size:14px;margin-bottom:46px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0;background:var(--dim)}
.dot.new{background:var(--acc)}.dot.old{background:#2f8f5b}.dot.skip{background:transparent;border:1.5px dashed var(--dim)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:46px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step img{width:100%;display:block;border-bottom:1px solid var(--line);background:#fff}
.step .ph{height:140px;display:flex;align-items:center;justify-content:center;color:var(--dim);border-bottom:1px solid var(--line)}
.step .b{padding:14px 16px 16px}
.verdict{font-family:var(--serif);font-style:italic;font-size:19px}
.name{font-weight:700;margin:6px 0 0}
.hash{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim)}
details{margin-top:10px;color:#5b606b;font-size:14px}summary{cursor:pointer;font-weight:600;color:var(--ink)}
details p{margin:6px 0}
pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;font-size:12.5px;margin:0}
.empty{padding:90px 0;text-align:center}
.empty h1{margin-bottom:12px}
.empty .sub{margin:0}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:min(520px,92vw);padding:26px}
dialog::backdrop{background:rgba(20,22,29,.5)}
dialog h2{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
label{display:block;margin:14px 0 5px;color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
dialog input,dialog select{width:100%}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.refs{grid-template-columns:1fr}.page{padding:30px 16px 70px}.bar{padding:12px 16px}}
</style>
</head>
<body>
<div class="bar">
  <div class="logo">Visual Bisect<i>.</i></div>
  <div class="sp"></div>
  <select id="runSel" aria-label="Run"></select>
  <button class="primary" id="newBtn">New run</button>
</div>
<main class="page" id="view"><div class="empty"><h1>Pick a run</h1><p class="sub">Choose one from the top right, or start a new one.</p></div></main>

<dialog id="dlg"><form id="form" method="dialog">
  <h2>New run</h2>
  <label>Local git repo path</label><input name="repo" required placeholder="C:\path\to\repo">
  <label>Good (old) commit</label><input name="good" required>
  <label>Bad (new) commit</label><input name="bad" value="HEAD">
  <label>What changed, in words</label><input name="focus" required placeholder="the left sidebar (logo, icons, text size)">
  <label>Page path</label><input name="url" value="/">
  <label>Judge</label><select name="judge"><option>gemma</option><option>pixel-full</option></select>
  <label>Preset</label><select name="preset"><option value="">vite (default)</option><option>next</option><option>static</option></select>
  <p style="margin:22px 0 0;display:flex;gap:10px;align-items:center"><button class="primary" type="submit">Start</button><button type="button" class="ghost" id="cancel">Cancel</button><span id="err" style="color:var(--acc);font-weight:600"></span></p>
</form></dialog>

<script>
const $=s=>document.querySelector(s);let cur=null,es=null,state=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=(run,name)=>`/api/file?run=${encodeURIComponent(run)}&name=${encodeURIComponent(name)}`;
const fresh=()=>({start:null,steps:{},order:[],done:null,failed:null,current:null,calls:{}});
const WORD={old:'looks old',new:'looks new',skip:'skipped'};

async function loadRuns(){
  try{
    const rows=await (await fetch('/api/runs')).json();
    $('#runSel').innerHTML='<option value="">Select a run…</option>'+rows.map(r=>`<option value="${esc(r.id)}" ${r.id===cur?'selected':''}>${esc(r.id)}  ·  ${esc(r.state)}</option>`).join('');
  }catch(e){}
}
function apply(e){
  const s=state;
  if(e.type==='run_started'){s.start=e;s.order=e.commits.map(c=>c.sha)}
  else if(e.type==='step_started'){s.current=e.sha;s.steps[e.sha]=s.steps[e.sha]||{}}
  else if(e.type==='render_done'){(s.steps[e.sha]=s.steps[e.sha]||{}).img=e.img}
  else if(e.type==='judge_call'){(s.calls[e.sha]=s.calls[e.sha]||[]).push(e)}
  else if(e.type==='step_done'){const x=s.steps[e.sha]=s.steps[e.sha]||{};x.verdict=e.verdict;x.skip=e.skip_reason;if(s.current===e.sha)s.current=null}
  else if(e.type==='run_done'){s.done=e;s.current=null}
  else if(e.type==='run_failed'){s.failed=e;s.current=null}
}
function stat(n,unit,label){return `<div class="stat"><div class="n">${esc(n)}${unit?`<u>${unit}</u>`:''}</div><div class="label">${label}</div></div>`}
function render(){
  const s=state;
  if(!s||!s.start){$('#view').innerHTML='<div class="empty"><h1>Starting</h1><p class="sub">Waiting for the first event…</p></div>';return}
  const st=s.start,subj=Object.fromEntries(st.commits.map(c=>[c.sha,c.subject]));
  const tested=s.order.filter(sha=>s.steps[sha]?.verdict);
  const skips=tested.filter(sha=>s.steps[sha].verdict==='skip').length;
  let story,callout='';
  if(s.failed){story='The run <b>failed</b> before it found anything.';callout=`<div class="callout"><div class="label">What went wrong</div><div class="d">${esc(String(s.failed.error).slice(0,400))}</div></div>`}
  else if(s.done&&s.done.culprit_sha){const sha=s.done.culprit_sha;story=`The look changed in <b>${esc(subj[sha]||'a commit')}</b> <code>${esc(sha.slice(0,10))}</code>.`}
  else if(s.done)story='We <b>could not narrow it to a single commit</b>; too many steps were skipped.';
  else story=`Still searching. <b>${tested.length}</b> of ${st.commits.length} commits tested${s.current?`, now testing <code>${esc(s.current.slice(0,10))}</code>`:''}.`;
  const secs=s.done?Math.round(s.done.seconds):'–';
  let h=`<h1>Result</h1><p class="sub">${esc(st.focus)}</p><hr class="rule"><div class="label">The short version</div><p class="story">${story}</p>${callout}`;
  h+=`<div class="stats">${stat(tested.length,'','Steps taken')}${stat(skips,'','Skipped')}${stat(secs,s.done?'s':'','Time')}${stat(st.commits.length,'','Commits in range')}</div>`;
  h+=`<div class="label">The change we are looking for · ${esc(st.judge)}${st.model?' · '+esc(st.model):''}</div>
  <div class="refs"><figure><figcaption class="label">Before</figcaption><img src="${img(cur,st.old_ref_img)}"></figure><figure><figcaption class="label">After</figcaption><img src="${img(cur,st.new_ref_img)}"></figure></div>`;
  const cells=s.order.map(sha=>{const v=s.steps[sha]?.verdict;return `<div class="cell ${v||''} ${s.current===sha?'cur':''} ${s.done?.culprit_sha===sha?'cul':''}" title="${esc(sha.slice(0,10)+'  '+subj[sha])}"></div>`}).join('');
  h+=`<div class="label">Every commit in the range</div><div class="strip">${cells}</div><div class="key"><span><i class="dot old"></i>looks old</span><span><i class="dot new"></i>looks new</span><span><i class="dot skip"></i>skipped</span><span><i class="dot" style="background:#fff;border:1.5px solid #cfcdc6"></i>not tested</span></div>`;
  const rows=[...tested].reverse();
  if(s.current&&!tested.includes(s.current))rows.unshift(s.current);
  if(rows.length){
    h+='<div class="label">What happened, step by step</div><div class="steps">'+rows.map(sha=>{
      const x=s.steps[sha]||{},c=(s.calls[sha]||[]).slice().sort((a,b)=>a.call_no-b.call_no);
      const why=c.length?`<details><summary>Why (${c.length} model call${c.length>1?'s':''})</summary>${c.map(k=>`<p>${esc(k.verdict)}, ${Math.round((k.confidence||0)*100)}% sure: ${esc(k.reason)}</p>`).join('')}</details>`:'';
      const note=x.skip?`<details open><summary>Why skipped</summary><p>${esc(String(x.skip).slice(0,200))}</p></details>`:'';
      return `<div class="step">${x.img?`<img src="${img(cur,x.img)}" loading="lazy">`:'<div class="ph">building…</div>'}<div class="b"><div class="verdict">${x.verdict?`<i class="dot ${x.verdict}"></i>${WORD[x.verdict]||esc(x.verdict)}`:'testing…'}</div><div class="name">${esc(subj[sha])}</div><div class="hash">${esc(sha.slice(0,10))}</div>${note}${why}</div></div>`}).join('')+'</div>';
  }
  if(s.done?.diff_file)h+='<div class="label">What that commit changed</div><pre id="diff">Loading…</pre>';
  $('#view').innerHTML=h;
  if(s.done?.diff_file)fetch(`/api/diff?run=${encodeURIComponent(cur)}`).then(r=>r.json()).then(d=>{const p=$('#diff');if(p)p.textContent=d.diff}).catch(()=>{});
}
async function open(id){
  if(es){es.close();es=null}
  cur=id||null;
  if(!cur){state=null;$('#view').innerHTML='<div class="empty"><h1>Pick a run</h1><p class="sub">Choose one from the top right, or start a new one.</p></div>';return}
  state=fresh();
  const evs=await (await fetch('/api/events?run='+encodeURIComponent(id))).json();
  evs.forEach(apply);render();loadRuns();window.scrollTo(0,0);
  if(!state.done&&!state.failed){
    let seen=0;const n=evs.length;
    es=new EventSource('/api/stream?run='+encodeURIComponent(id));
    es.onmessage=m=>{if(seen++<n)return;apply(JSON.parse(m.data));render()};
    es.onerror=()=>{if(es){es.close();es=null}loadRuns()};
  }
}
$('#runSel').onchange=e=>open(e.target.value);
$('#newBtn').onclick=()=>$('#dlg').showModal();
$('#cancel').onclick=()=>$('#dlg').close();
$('#form').onsubmit=async ev=>{
  ev.preventDefault();
  const body=Object.fromEntries(new FormData(ev.target));if(!body.preset)delete body.preset;
  const r=await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){$('#err').textContent=(await r.json()).detail||'failed';return}
  const {id}=await r.json();$('#dlg').close();setTimeout(async()=>{await loadRuns();$('#runSel').value=id;open(id)},1500);
};
loadRuns();setInterval(loadRuns,5000);
</script>
</body>
</html>
