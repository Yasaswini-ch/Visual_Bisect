<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Bisect</title>
<style>
:root{--bg:#ececec;--panel:#f7f7f7;--ink:#111;--dim:#6d6d6d;--line:#d6d6d6;--stage:#0f0f10;--stage2:#1b1b1d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Inter","Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.top{display:flex;align-items:center;gap:14px;padding:24px 0}
.logo{font-weight:800;font-size:26px;letter-spacing:-.04em}
.logo span{color:var(--dim);font-weight:500;font-size:15px;letter-spacing:0;margin-left:10px}
.sp{flex:1}
.kicker{display:inline-block;border:1.5px solid var(--ink);border-radius:8px;padding:2px 12px;font-size:15px;margin-bottom:22px}
.hero{padding:40px 0 56px;text-align:center}
.hero h1{font-size:clamp(40px,8.2vw,112px);line-height:.95;letter-spacing:-.045em;font-weight:800;text-transform:uppercase;margin:0 auto 22px;max-width:1100px;overflow-wrap:anywhere}
.hero .meta{color:var(--dim);font-size:18px}
.hash{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--dim)}
.stage{background:var(--stage);border-radius:28px;padding:30px;color:#fff}
.stage h2{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:.02em}
.stage p{margin:0 0 22px;color:#9a9a9a}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.refs figure{margin:0}
.refs img{width:100%;display:block;border-radius:14px;background:#fff}
figcaption{color:#aaa;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
h3{font-size:clamp(30px,4.6vw,56px);letter-spacing:-.04em;line-height:1;font-weight:800;text-transform:uppercase;margin:80px 0 26px}
.strip{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border-radius:22px;padding:22px}
.cell{width:14px;height:44px;border-radius:7px;border:2px solid #c4c4c4;background:transparent}
.cell.old{background:#c4c4c4}.cell.new{background:var(--ink);border-color:var(--ink)}
.cell.skip{border-style:dashed;border-color:#888;background:repeating-linear-gradient(135deg,transparent 0 3px,#d0d0d0 3px 5px)}
.cell.cur{outline:3px solid var(--ink);outline-offset:3px}
.cell.cul{outline:3px solid var(--ink);outline-offset:3px;background:#fff}
.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;color:var(--dim);font-size:15px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:8px;vertical-align:-1px;border:2px solid #c4c4c4}
.legend .o::before{background:#c4c4c4}.legend .n::before{background:var(--ink);border-color:var(--ink)}
.legend .s::before{border-style:dashed;border-color:#888}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.step{background:var(--panel);border-radius:24px;overflow:hidden}
.step .shot{background:var(--stage);padding:14px}
.step img{width:100%;display:block;border-radius:10px;background:#fff}
.step .ph{height:170px;display:flex;align-items:center;justify-content:center;color:#888}
.step .b{padding:18px 20px 22px}
.pill{display:inline-block;padding:3px 16px;border-radius:99px;font-size:14px;font-weight:600;border:2px solid #aaa;color:#555}
.pill.new{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.old{border-color:#c4c4c4;background:#e2e2e2;color:var(--ink)}
.pill.skip{border-style:dashed}
.sub{margin:12px 0 2px;font-weight:700;font-size:19px;letter-spacing:-.02em}
details{margin-top:10px;color:var(--dim);font-size:15px}summary{cursor:pointer;font-weight:600;color:var(--ink)}
details p{margin:8px 0}
pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:var(--stage);color:#ddd;border-radius:22px;padding:22px;font-size:13px;margin:0}
.empty{text-align:center;padding:120px 0;font-size:clamp(28px,5vw,64px);font-weight:800;letter-spacing:-.04em;text-transform:uppercase;line-height:1}
.empty small{display:block;font-size:18px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim);margin-top:16px}
/* floating pill bar */
.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;align-items:center;background:rgba(20,20,22,.94);padding:8px;border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-width:calc(100vw - 24px)}
.dock .w{background:#2a2a2d;color:#fff;font-weight:800;border-radius:14px;padding:10px 16px;font-size:20px}
select,input{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.dock select{background:#2a2a2d;color:#fff;border:0;max-width:min(360px,46vw)}
button{font:inherit;font-weight:600;white-space:nowrap;border:0;border-radius:14px;padding:12px 20px;cursor:pointer}
button.primary{background:#ececec;color:var(--ink)}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
dialog{background:var(--bg);color:var(--ink);border:0;border-radius:28px;width:min(540px,92vw);padding:30px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font-size:40px;letter-spacing:-.04em;text-transform:uppercase;font-weight:800;line-height:1}
label{display:block;margin:14px 0 6px;color:var(--dim);font-size:14px;font-weight:600}
dialog input,dialog select{width:100%}
dialog button.primary{background:var(--ink);color:#fff}
main{padding-bottom:140px}
@media(max-width:720px){.refs{grid-template-columns:1fr}.wrap{padding:0 16px}.stage{padding:18px;border-radius:22px}h3{margin-top:56px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">Visual Bisect<span>git bisect that can see</span></div><div class="sp"></div></div>
  <main id="view"><div class="empty">Pick a run<small>Use the bar below, or start a new one.</small></div></main>
</div>

<nav class="dock" aria-label="Runs">
  <div class="w">vb.</div>
  <select id="runSel" aria-label="Run"></select>
  <button class="primary" id="newBtn">New run</button>
</nav>

<dialog id="dlg"><form id="form" method="dialog">
  <h2>New run</h2>
  <label>Local git repo path</label><input name="repo" required placeholder="C:\path\to\repo">
  <label>Good (old) commit</label><input name="good" required>
  <label>Bad (new) commit</label><input name="bad" value="HEAD">
  <label>What changed, in words</label><input name="focus" required placeholder="the left sidebar (logo, icons, text size)">
  <label>Page path</label><input name="url" value="/">
  <label>Judge</label><select name="judge"><option>gemma</option><option>pixel-full</option></select>
  <label>Preset</label><select name="preset"><option value="">vite (default)</option><option>next</option><option>static</option></select>
  <p style="margin:24px 0 0;display:flex;gap:10px;align-items:center"><button class="primary" type="submit">Start</button><button type="button" class="ghost" id="cancel">Cancel</button><span id="err" style="font-weight:600"></span></p>
</form></dialog>

<script>
const $=s=>document.querySelector(s);let cur=null,es=null,state=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=(run,name)=>`/api/file?run=${encodeURIComponent(run)}&name=${encodeURIComponent(name)}`;
const fresh=()=>({start:null,steps:{},order:[],done:null,failed:null,current:null,calls:{}});

async function loadRuns(){
  try{
    const rows=await (await fetch('/api/runs')).json();
    $('#runSel').innerHTML='<option value="">Select a run…</option>'+rows.map(r=>`<option value="${esc(r.id)}" ${r.id===cur?'selected':''}>${esc(r.id)}  ·  ${esc(r.state)}</option>`).join('');
  }catch(e){}
}
function apply(e){
  const s=state;
  if(e.type==='run_started'){s.start=e;s.order=e.commits.map(c=>c.sha)}
  else if(e.type==='step_started'){s.current=e.sha;s.steps[e.sha]=s.steps[e.sha]||{}}
  else if(e.type==='render_done'){(s.steps[e.sha]=s.steps[e.sha]||{}).img=e.img}
  else if(e.type==='judge_call'){(s.calls[e.sha]=s.calls[e.sha]||[]).push(e)}
  else if(e.type==='step_done'){const x=s.steps[e.sha]=s.steps[e.sha]||{};x.verdict=e.verdict;x.skip=e.skip_reason;if(s.current===e.sha)s.current=null}
  else if(e.type==='run_done'){s.done=e;s.current=null}
  else if(e.type==='run_failed'){s.failed=e;s.current=null}
}
function render(){
  const s=state;
  if(!s||!s.start){$('#view').innerHTML='<div class="empty">Starting<small>Waiting for the first event…</small></div>';return}
  const st=s.start,subj=Object.fromEntries(st.commits.map(c=>[c.sha,c.subject]));
  const tested=s.order.filter(sha=>s.steps[sha]?.verdict);
  let hero;
  if(s.failed) hero=`<div class="hero"><div class="kicker">Run failed</div><h1>Something broke</h1><div class="meta">${esc(String(s.failed.error).slice(0,300))}</div></div>`;
  else if(s.done&&s.done.culprit_sha) hero=`<div class="hero"><div class="kicker">Culprit found &middot; ${esc(s.done.culprit_sha.slice(0,10))}</div><h1>${esc(subj[s.done.culprit_sha]||'')}</h1><div class="meta">${s.done.steps} steps &middot; ${s.done.skips} skipped &middot; ${s.done.api_calls} model calls &middot; ${s.done.seconds}s</div></div>`;
  else if(s.done) hero=`<div class="hero"><div class="kicker">Finished</div><h1>No single culprit</h1><div class="meta">${s.done.skips} steps were skipped as unsure or failed.</div></div>`;
  else hero=`<div class="hero"><div class="kicker">Searching &middot; ${tested.length} of ${st.commits.length} tested</div><h1>${esc(st.focus)}</h1><div class="meta">${s.current?'Testing '+esc(s.current.slice(0,10))+'…':'&nbsp;'}</div></div>`;
  let h=hero;
  h+=`<div class="stage"><h2>The change we are looking for</h2><p>${esc(st.focus)} &middot; judge: ${esc(st.judge)}${st.model?' &middot; '+esc(st.model):''}</p>
  <div class="refs"><figure><figcaption>Before</figcaption><img src="${img(cur,st.old_ref_img)}"></figure><figure><figcaption>After</figcaption><img src="${img(cur,st.new_ref_img)}"></figure></div></div>`;
  const cells=s.order.map(sha=>{const v=s.steps[sha]?.verdict;return `<div class="cell ${v||''} ${s.current===sha?'cur':''} ${s.done?.culprit_sha===sha?'cul':''}" title="${esc(sha.slice(0,10)+'  '+subj[sha])}"></div>`}).join('');
  h+=`<h3>Search</h3><div class="strip">${cells}</div><div class="legend"><span class="o">looks old</span><span class="n">looks new</span><span class="s">skipped</span><span>not tested</span></div>`;
  const rows=[...tested].reverse();
  if(s.current&&!tested.includes(s.current))rows.unshift(s.current);
  if(rows.length){
    h+='<h3>Steps</h3><div class="steps">'+rows.map(sha=>{
      const x=s.steps[sha]||{},c=(s.calls[sha]||[]).slice().sort((a,b)=>a.call_no-b.call_no);
      const why=c.length?`<details><summary>Why (${c.length} model call${c.length>1?'s':''})</summary>${c.map(k=>`<p>${esc(k.verdict)}, ${Math.round((k.confidence||0)*100)}% sure: ${esc(k.reason)}</p>`).join('')}</details>`:'';
      const note=x.skip?`<details open><summary>Skipped</summary><p>${esc(String(x.skip).slice(0,200))}</p></details>`:'';
      return `<div class="step"><div class="shot">${x.img?`<img src="${img(cur,x.img)}" loading="lazy">`:'<div class="ph">building…</div>'}</div><div class="b">${x.verdict?`<span class="pill ${x.verdict}">${x.verdict==='old'?'looks old':x.verdict==='new'?'looks new':'skipped'}</span>`:'<span class="pill">testing…</span>'}<div class="sub">${esc(subj[sha])}</div><div class="hash">${esc(sha.slice(0,10))}</div>${note}${why}</div></div>`}).join('')+'</div>';
  }
  if(s.done?.diff_file)h+='<h3>The diff</h3><pre id="diff">Loading…</pre>';
  $('#view').innerHTML=h;
  if(s.done?.diff_file)fetch(`/api/diff?run=${encodeURIComponent(cur)}`).then(r=>r.json()).then(d=>{const p=$('#diff');if(p)p.textContent=d.diff}).catch(()=>{});
}
async function open(id){
  if(es){es.close();es=null}
  cur=id||null;
  if(!cur){state=null;$('#view').innerHTML='<div class="empty">Pick a run<small>Use the bar below, or start a new one.</small></div>';return}
  state=fresh();
  const evs=await (await fetch('/api/events?run='+encodeURIComponent(id))).json();
  evs.forEach(apply);render();loadRuns();window.scrollTo(0,0);
  if(!state.done&&!state.failed){
    let seen=0;const n=evs.length;
    es=new EventSource('/api/stream?run='+encodeURIComponent(id));
    es.onmessage=m=>{if(seen++<n)return;apply(JSON.parse(m.data));render()};
    es.onerror=()=>{if(es){es.close();es=null}loadRuns()};
  }
}
$('#runSel').onchange=e=>open(e.target.value);
$('#newBtn').onclick=()=>$('#dlg').showModal();
$('#cancel').onclick=()=>$('#dlg').close();
$('#form').onsubmit=async ev=>{
  ev.preventDefault();
  const body=Object.fromEntries(new FormData(ev.target));if(!body.preset)delete body.preset;
  const r=await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){$('#err').textContent=(await r.json()).detail||'failed';return}
  const {id}=await r.json();$('#dlg').close();setTimeout(async()=>{await loadRuns();$('#runSel').value=id;open(id)},1500);
};
loadRuns();setInterval(loadRuns,5000);
</script>
</body>
</html>
